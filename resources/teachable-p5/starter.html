<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimal p5.js sketch</title><style>body{font:16px Arial;margin:40px auto;padding:0 24px;max-width:1000px;line-height:1.5}h1{font-size:45px;letter-spacing:-.05em}pre{background:#f4f4f4;padding:24px;overflow:auto;font-size:13px}button{background:white;border:1px solid;padding:8px 14px;cursor:pointer}a{color:inherit}</style><h1>Your model in p5.js</h1><p>Replace your entire sketch.js with this code. Change MODEL_URL to your exported image model URL. The model libraries load automatically.</p><p><button id="copy">Copy complete sketch</button> <a href="https://editor.p5js.org/" target="_blank" rel="noreferrer">Open p5.js editor ↗</a> / <a href="starter-sketch.js" download>Download JavaScript</a> / <a href="minimal-sketch.md">Markdown guide</a></p><p id="status" role="status"></p><pre><code id="source">Loading…</code></pre><script>let source='';fetch('starter-sketch.js').then(r=>{if(!r.ok)throw Error('Could not load sketch');return r.text()}).then(text=>{source=text;document.querySelector('#source').textContent=text}).catch(e=>document.querySelector('#status').textContent=e.message);document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(source);document.querySelector('#status').textContent='Copied. Paste into sketch.js.'}catch{document.querySelector('#status').textContent='Select the code below and copy it.'}};</script></html>
