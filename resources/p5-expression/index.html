<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face tracking / Affective Sensing</title><link rel="stylesheet" href="presenter.css"><script defer src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script><script defer src="https://cdn.jsdelivr.net/gh/ml5js/Intro-ML-Arts-IMA@ml5-build-10-7-19/ml5_build/ml5.min.js"></script><script defer src="../shared/live-ui.js"></script><script defer src="../shared/bridge.js"></script><script defer src="sketch.js"></script></head><body><div class="controls"><button id="start" disabled>Start camera</button><button id="stop" disabled>Stop camera</button><button id="pretrained" hidden>Use pretrained model</button><span id="model-state" role="status">Preloading expression model…</span></div><p id="status" role="status">Camera off.</p><div class="camera-layout"><div class="camera-window"><div id="camera"></div><canvas id="face-overlay" width="480" height="360" aria-label="Tracked face and current expression"></canvas><button id="dock-stop" title="Stop camera" hidden>Stop</button></div><aside><h2 id="model-title">Expression model</h2><p id="result" aria-live="polite">No prediction</p><div id="scores"></div><p class="note">The box follows the detected face. Labels and scores come from the selected model.</p></aside></div><details class="standalone"><summary>Send values to TouchDesigner</summary><button id="connect">Connect to TouchDesigner</button><p id="bridge-status">Not connected.</p></details></body></html>
